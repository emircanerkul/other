server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web app: single page, all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Local-dev hygiene: always re-fetch the loader files so a rebuilt app
    # is never shadowed by a stale copy (the Flutter service worker's
    # Cache Storage is the usual culprit for "old bundle after rebuild").
    location = /main.dart.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
