<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="./favicon.png">
<title>PHP Playground — other projects</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; display: flex; height: 100vh; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #status { padding: .45rem 1rem; font-size: .78rem; font-family: ui-monospace, monospace; opacity: .75; border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #frame { flex: 1; border: 0; width: 100%; background: #fff; }
</style>
</head>
<body>
<main>
  <div id="status">booting…</div>
  <iframe id="frame" title="PHP app output" sandbox="allow-forms allow-scripts allow-same-origin allow-modals"></iframe>
</main>
<script type="module" src="./playground.mjs"></script>
</body>
</html>
