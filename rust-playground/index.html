<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="./favicon.png">
<title>Rust Playground — other projects</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; display: flex; height: 100vh; }
  aside { width: 340px; border-right: 1px solid color-mix(in srgb, currentColor 15%, transparent); padding: 1rem; overflow-y: auto; flex-shrink: 0; }
  aside h1 { font-size: 1rem; margin: 0 0 .8rem; }
  aside h1 a { color: inherit; text-decoration: none; }
  aside .warn { color: #b58105; font-size: .75rem; margin: 0 0 .8rem; }
  #list button { display: block; width: 100%; text-align: left; margin-bottom: .35rem; padding: .45rem .6rem; border-radius: 8px; border: 1px solid color-mix(in srgb, currentColor 20%, transparent); background: transparent; color: inherit; cursor: pointer; }
  #list button:hover:not(:disabled) { background: color-mix(in srgb, currentColor 8%, transparent); }
  #list button.active { border-color: #b7410e; background: color-mix(in srgb, #b7410e 15%, transparent); }
  #list button:disabled { opacity: .45; cursor: default; }
  #list .ex-title { display: block; font-size: .85rem; font-weight: 600; }
  #list .ex-desc { display: block; font-size: .7rem; opacity: .6; margin-top: .1rem; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #status { padding: .45rem 1rem; font-size: .78rem; font-family: ui-monospace, monospace; opacity: .75; border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #frame { flex: 1; border: 0; width: 100%; background: #fff; }
</style>
</head>
<body>
<aside>
  <h1><a href="./">🦀 Rust Playground</a></h1>
  <div class="warn">Every learning example from project/rust-first-step, compiled to WebAssembly with the Emscripten toolchain — runs fully in your browser.</div>
  <div id="list"></div>
</aside>
<main>
  <div id="status">pick an example…</div>
  <iframe id="frame" title="Rust example output" sandbox="allow-forms allow-scripts allow-same-origin allow-modals"></iframe>
</main>
<script type="module" src="./playground.mjs"></script>
</body>
</html>
